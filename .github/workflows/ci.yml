name: ci
on:
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    name: "lint + test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/lithium
          cache: "npm"
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
